name: Chore
description: Technical maintenance, hygiene, or non-functional support work
title: "[Chore] "
labels: ["type:chore"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for routine technical maintenance or non-functional support work.

        After creating the issue:
        - assign the correct Milestone
        - add it to the Project
        - set Project fields
        - set the Parent issue if applicable

  - type: textarea
    id: task_description
    attributes:
      label: What needs to be done
      placeholder: |
        Describe the maintenance or support task clearly.
    validations:
      required: true

  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of Done
      value: |
        - [ ] Work completed
        - [ ] No regression introduced
        - [ ] Documentation updated if needed
    validations:
      required: true

  - type: input
    id: parent_epic
    attributes:
      label: Parent Epic
      description: Optional Epic reference
      placeholder: "#123 [Epic][M0] Repo & Docs Stabilization"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional context, risks, or constraints
      placeholder: |
        - Relevant files
        - Constraints
        - Risk notes
    validations:
      required: false
